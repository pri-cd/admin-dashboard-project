<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./assets/styles.css">
    <script src="./assets/script.js" defer></script>
</head>

<body>
    <aside class="sidebar" id="sidebar">
        <div class="dashboard">
            <img src="./assets/SidebarIcons/dashboard.png" alt="">
            <h2>Dashboard</h2>
        </div>

        <nav class="navigation">
            <ul class="nav_group_general">
                <li><a href="#"><img src="./assets/SidebarIcons/home.png" alt="">Home</a></li>
                <li><a href="#"><img src="./assets/SidebarIcons/profile.png" alt="">Profile</a></li>
                <li><a href="#"><img src="./assets/SidebarIcons/message.png" alt="">Messages</a></li>
                <li><a href="#"><img src="./assets/SidebarIcons/history.png" alt="">History</a></li>
                <li><a href="#"><img src="./assets/SidebarIcons/task.png" alt="">Tasks</a></li>
                <li><a href="#"><img src="./assets/SidebarIcons/community.png" alt="">Communities</a></li>
            </ul>

            <ul class="nav_group_others">
                <li><a href="#"><img src="./assets/SidebarIcons/setting.png" alt="">Settings</a></li>
                <li><a href="#"><img src="./assets/SidebarIcons/support.png" alt="">Support</a></li>
                <li><a href="#"><img src="./assets/SidebarIcons/privacy.png" alt="">Privacy</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main_content">
        <header class="header">

            <div class="top_header">
                <search class="search">
                    <label for="search"><img src="./assets/MainIcons/search.svg" alt=""></label>
                    <input type="text" id="search" name="search">
                </search>

                <div class="top_left_header">
                    <img class="notification" id="notification" src="./assets/MainIcons/notification.svg" alt="">
                    <img class="user_image" id="user_image" src="./assets/User/user.jpg" alt="">
                    <h4>Mr. Ice Bear</h4>
                </div>
            </div>

            <div class="bottom_header">
                <div class="introduction">
                    <img src="./assets/User/user-other.jpg" alt="">
                    <div class="introduction_text">
                        <p>Hi, there</p>
                        <h3>Mr. Ice Bear (@StrongestBearGRRR)</h3>
                    </div>
                </div>

                <div class="bottom_header_actions">
                    <button class="action_btn new_btn" id="new_btn">New</button>
                    <button class="action_btn upload_btn" id="upload_btn">Upload</button>
                    <button class="action_btn share_btn" id="share_btn">Share</button>
                </div>
            </div>
        </header>

        <div class="main_grid">
            <section class="article_section">
                <h4>Mr. Bear's Articles</h4>
                <div class="article_container" id="article_container">
        
                </div>
            </section>
            <section class="announcement_section">
                <h4>Announcements</h4>
                <div class="announcement_container">
                    <div class="announcement_site_maintenance"></div>
                    <div class="announcement_comm_share_day"></div>
                    <div class="announcement_updated_priv_policy"></div>
                </div>
            </section>
            <section class="trending_section">
                <h4>Trending</h4>
                <div class="trending_container"></div>
            </section>
        </div>
    </main>
</body>

</html>
